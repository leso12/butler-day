<title>부집사 에렌의 하루</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Do+Hyeon&display=swap">
<style>
/* Layout: one-screen game — HUD strip, pixel stage (dialogue overlaid), touch pad strip */
:root{
  --ink:#171012; --wood:#2a1c19; --wood2:#4a3027; --gold:#c9a45a; --gold-dim:#8c7038;
  --parch:#f4e9d3; --parch2:#e6d5b4; --text:#2d1f18; --muted:#7d6a58; --rose:#c4607a;
  --f-ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-story:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--ink);color:var(--parch);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--wood);border-bottom:2px solid var(--gold-dim);flex:none}
.place{font-size:15px;color:var(--gold);letter-spacing:.02em;white-space:nowrap}
.clock{display:flex;gap:8px;align-items:baseline;background:var(--ink);border:1px solid var(--gold-dim);border-radius:4px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{font-weight:400;color:var(--parch);font-size:16px}
.clock span{color:var(--gold);font-size:14px}
.sp{flex:1}
.stat{display:flex;flex-direction:column;gap:3px;min-width:58px}
.hp{display:block;height:7px;background:var(--ink);border:1px solid var(--gold-dim);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:#8fa36a;transition:width .3s}
.hp i.low{background:#c07a5a}
.coin{font-size:13px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.coin b{font-weight:400;color:var(--parch)}
#bwork span{color:var(--gold);font-size:13px}
#mg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 24px));background:var(--parch);color:var(--text);border:3px solid var(--wood2);box-shadow:inset 0 0 0 2px var(--gold),0 8px 0 rgba(0,0,0,.35);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#mg h3{margin:0;font-weight:400;font-size:20px;color:var(--wood2);display:flex;justify-content:space-between;align-items:baseline}
#mg h3 small{font-size:13px;color:var(--muted)}
#mg p{margin:0;font-family:var(--f-story);font-size:15px;line-height:1.6;word-break:keep-all}
.mbar{position:relative;height:26px;background:#e2d3b4;border:2px solid var(--wood2);border-radius:4px;overflow:hidden}
.mbar .zone{position:absolute;top:0;bottom:0;background:#b9c79a}
.mbar .zone.p{background:#8fa36a}
.mbar .mk{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--wood);box-shadow:0 0 0 1px var(--parch)}
.mbar .fillb{position:absolute;left:0;top:0;bottom:0;background:#9fb4c0;transition:width .08s}
.mtime{height:5px;background:#e2d3b4;border-radius:3px;overflow:hidden}.mtime i{display:block;height:100%;background:var(--rose)}
.mhint{font-size:14px;color:var(--muted);text-align:center}
.mbig{font-size:22px;text-align:center;font-family:var(--f-story)}
.mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mopts button{font-family:var(--f-ui);font-size:18px;background:var(--parch2);border:2px solid #cdb68c;border-radius:4px;padding:8px 0;color:var(--text);cursor:pointer}
.mopts button.sel{border-color:var(--wood2);background:#f9eccd}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed #cdb68c}
.task .ck{width:18px;height:18px;border:2px solid var(--wood2);border-radius:3px;display:grid;place-items:center;font-size:13px;color:var(--wood2)}
.task.done .ck{background:#8fa36a;border-color:#6d7f50;color:#fff}
.task .tn{font-size:16px}.task .tw{font-size:13px;color:var(--muted)}
.task.done .tn{color:var(--muted);text-decoration:line-through}
.task .gr{font-size:13px;color:var(--wood2)}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--wood2);margin-bottom:4px}.kv b{font-weight:400;color:var(--text)}
.hbtn{font-family:var(--f-ui);font-size:15px;background:var(--wood2);color:var(--parch);border:1px solid var(--gold-dim);border-radius:4px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.hbtn:focus-visible,.cbtn:focus-visible,.pbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hbtn[aria-pressed="true"]{background:var(--gold);color:var(--wood);border-color:var(--gold)}
@media (max-width:420px){.place{display:none}}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#game{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}

#stand{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding-left:max(4%,env(safe-area-inset-left,0px));padding-right:max(4%,env(safe-area-inset-right,0px))}
#stand canvas{image-rendering:pixelated;image-rendering:crisp-edges;transition:filter .2s, transform .2s;max-width:48%}
#stand canvas.card{border:3px solid var(--wood2);box-shadow:0 0 0 2px var(--gold),0 8px 18px rgba(0,0,0,.45);border-radius:6px;background:var(--parch2)}
#stand{top:auto!important;align-items:flex-end}
#stand canvas.dim{filter:brightness(.45) saturate(.6)}
#stand canvas.talk{transform:translateY(-4px)}

#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(760px,calc(100% - 20px));display:flex;gap:12px;background:var(--parch);color:var(--text);border:3px solid var(--wood2);box-shadow:inset 0 0 0 2px var(--gold),0 6px 0 rgba(0,0,0,.35);border-radius:6px;padding:16px 14px 14px;min-height:118px;cursor:pointer}
#dname{position:absolute;top:-15px;left:14px;background:var(--wood);color:var(--parch);border:2px solid var(--gold);border-radius:4px;padding:1px 12px;font-size:16px;letter-spacing:.03em}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#dtext{font-family:var(--f-story);font-size:16.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere;min-height:3.4em}
#dlg.nar #dtext{font-style:italic;color:#5a4636}
#choices{display:flex;flex-direction:column;gap:6px}
.cbtn{font-family:var(--f-story);font-size:15.5px;text-align:left;background:var(--parch2);color:var(--text);border:2px solid #cdb68c;border-radius:4px;padding:7px 10px;cursor:pointer}
.cbtn.sel{border-color:var(--wood2);background:#f9eccd;box-shadow:inset 4px 0 0 var(--rose)}
#next{position:absolute;right:12px;bottom:8px;color:var(--rose);font-size:13px;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#pbox{flex:none;width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--parch2);border:2px solid var(--wood2);border-radius:4px;padding:4px;align-self:flex-start}
#pcv{width:128px;height:128px;image-rendering:pixelated;image-rendering:crisp-edges}
#pname{font-size:15px;color:var(--parch);background:var(--wood2);border-radius:3px;padding:0 10px;margin-top:2px}
#dlg.pm #dname{display:none}
@media (max-width:440px){#pbox{width:100px}#pcv{width:88px;height:88px}#dtext{font-size:15.5px}}

#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(23,16,18,.88);color:var(--parch);border:1px solid var(--gold-dim);border-radius:20px;padding:5px 14px;font-size:15px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#toast i{font-style:normal;color:var(--rose)}
#where{position:absolute;left:10px;top:10px;font-size:15px;color:var(--parch);background:rgba(23,16,18,.72);border:1px solid var(--gold-dim);border-radius:4px;padding:3px 10px;pointer-events:none;letter-spacing:.02em}
#panel.wide{width:calc(100% - 12px);max-width:960px;padding:10px}
.mapwrap{position:relative;width:100%;border:2px solid var(--wood2);border-radius:4px;overflow:hidden;background:#3a2a24}
.mapwrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.md.np.fk{width:5px;height:5px;background:#8a9a7a;opacity:.8}
.ml{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:#2d1f18;background:rgba(244,233,211,.82);border-radius:3px;padding:0 3px;white-space:nowrap;pointer-events:none}
.md{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #fff;pointer-events:none}
.md.me{background:var(--rose);width:13px;height:13px;margin:-6px 0 0 -6px}
.md.np{background:#3a4a6a;font-size:0}
.mt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:#f2c75c;border:2px solid #3a2a1e;transform:rotate(45deg);pointer-events:none}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--wood2);margin-top:8px}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.sched{font-size:12px;color:var(--muted);line-height:1.5}
.sched b{font-weight:400;color:var(--wood2)}
.hud{flex-wrap:wrap;row-gap:6px}
#black{position:absolute;inset:0;background:#0c0809;opacity:0;pointer-events:none;transition:opacity .5s}
#black.on{opacity:1}
#title{position:absolute;inset:0;background:linear-gradient(#2b1d22d8,#140d10f0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;padding:16px;overflow:auto}
#title h1{font-family:var(--f-story);color:#f4e6cc;font-size:clamp(22px,6vw,34px);margin:0 0 2px;text-align:center;word-break:keep-all}
#title .sub2{color:#d9c4a0;font-size:14px;margin-bottom:12px;text-align:center}
#title .tb{width:min(340px,100%);font-family:var(--f-ui);font-size:17px;padding:10px 14px;background:var(--parch);color:var(--text);border:3px solid var(--wood2);border-radius:6px;cursor:pointer;text-align:left}
#title .tb small{display:block;font-size:12px;color:var(--muted)}
#title .tb:disabled{opacity:.45;cursor:default}
.slot{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px dashed #cdb68c}
.slot .tw{font-size:13px;color:var(--muted)}
.slot .bs{display:flex;gap:6px}
#ctime.hold::after{content:' ⏸';color:#f2c75c}
.diary{padding:10px 0;border-top:1px dashed #cdb68c}.diary .dh{font-size:15px;color:var(--wood2);font-weight:600}.diary .dh small{font-size:11px;color:var(--rose);margin-left:4px}
.diary .rp{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.pbtn.sm{font-size:12px;padding:3px 8px}
#lbT,#lbB{position:absolute;left:0;right:0;height:0;background:#0c0809;transition:height .55s ease;pointer-events:none}#lbT{top:0}#lbB{bottom:0}
#app.scene #lbT,#app.scene #lbB{height:9%}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(24,8,16,.6))}
#app.scene #vig{opacity:1}
.hud,#where,.help{transition:opacity .4s}#app.scene .hud,#app.scene #where,#app.scene .help{opacity:0;pointer-events:none}
#card{position:absolute;inset:0;background:#0c0809;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s;cursor:pointer}
#card.on{opacity:1;pointer-events:auto}
#card .ct{font-family:var(--f-story);color:#f4e6cc;font-size:clamp(20px,5.5vw,30px);letter-spacing:.06em;text-align:center;padding:0 24px;word-break:keep-all;line-height:1.4}
#card .cs{color:#c9a35e;font-size:13px;letter-spacing:.25em;text-align:center}
#card .ln{width:110px;height:1px;background:#c9a35e;margin:12px 0;opacity:.7}
#card .ct,#card .cs,#card .ln{animation:cardin 1.2s ease both}#card .cs{animation-delay:.25s}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:700px){.help{display:none}}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hbtn:disabled,.pbtn:disabled{opacity:.45;cursor:default}
.wx{color:var(--parch);font-size:13px;opacity:.85}
#bmenu.dot{box-shadow:inset 0 0 0 2px var(--rose)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{font-family:var(--f-ui);font-size:15px;background:var(--parch2);color:var(--wood2);border:1px solid #cdb68c;border-radius:4px;padding:3px 10px;cursor:pointer}
.tab.on{background:var(--wood2);color:var(--parch);border-color:var(--wood2)}
.sub{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-top:8px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed #cdb68c}
.row>div{min-width:0}.row .tn{font-size:16px}.row small{font-size:12px;color:var(--muted)}
.row .tw{font-size:13px;color:var(--muted)}
.story{font-family:var(--f-story);font-size:14.5px;line-height:1.6;color:var(--text);margin:6px 0;word-break:keep-all}
.letter{padding:8px 0;border-top:1px dashed #cdb68c}.letter .tn{font-size:16px}
.pref{font-size:12px;border-radius:3px;padding:0 5px;margin-left:4px;color:#fff}
.pref.love{background:#c4607a}.pref.like{background:#8fa36a}.pref.neu{background:#9a8a7a}.pref.dis{background:#5a5a68}
.kv.col{flex-direction:column;gap:6px}
.meter{display:block;height:8px;background:#e2d3b4;border-radius:4px;overflow:hidden;border:1px solid #cdb68c}.meter i{display:block;height:100%;background:#b0647a}
.task .ck.pk{background:#ee9ab0;border-color:#b0647a;color:#fff}
.mt.pk{background:#ee9ab0}
.ml.nl{font-size:10px;background:rgba(58,74,106,.85);color:#fff}
.mlegend i.sq{border-radius:0;transform:rotate(45deg)}
.help{position:absolute;right:10px;top:10px;font-size:13px;color:var(--parch);opacity:.6;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:4px;pointer-events:none}
@media (pointer:coarse){.help{display:none}}

#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--parch);color:var(--text);border:3px solid var(--wood2);box-shadow:inset 0 0 0 2px var(--gold);border-radius:6px;padding:14px 16px}
#panel h2{margin:0 0 10px;font-weight:400;font-size:20px;color:var(--wood2);display:flex;justify-content:space-between;align-items:center}
.rel{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed #cdb68c}
.rel canvas{width:64px;height:64px;image-rendering:pixelated;background:var(--parch2);border:1px solid #cdb68c;border-radius:3px}
.rel .nm{font-size:17px}
.rel .nm small{font-size:13px;color:var(--muted);margin-left:6px}
.hearts{color:var(--rose);letter-spacing:1px;font-size:14px;font-family:system-ui,sans-serif}
.hearts .e{color:#cdb68c}
.chip{font-size:12px;color:var(--muted);margin-left:6px}
.pbtn{font-family:var(--f-ui);font-size:14px;background:var(--wood2);color:var(--parch);border:0;border-radius:4px;padding:5px 10px;cursor:pointer}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #cdb68c;font-size:13px;color:var(--muted)}

#pad{display:none;justify-content:space-between;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--wood);border-top:2px solid var(--gold-dim);flex:none;touch-action:none}
@media (pointer:coarse){#pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}
.dpad button{background:var(--wood2);border:1px solid var(--gold-dim);border-radius:6px;color:var(--parch);font-size:18px;touch-action:none}
.dpad button.on{background:var(--gold);color:var(--wood)}
.dpad .c{background:transparent;border:0}
.abtn{width:84px;height:84px;border-radius:50%;background:var(--gold);color:var(--wood);border:3px solid var(--parch2);font-family:var(--f-ui);font-size:19px;touch-action:none;box-shadow:0 4px 0 var(--gold-dim)}
.abtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-dim)}
@media (prefers-reduced-motion:reduce){#next{animation:none}#fade{transition:none}}
</style>

<div id="app">
  <div class="hud">
    <div class="clock"><span id="cday">겨울 1일 (월)</span><b id="ctime">오전 6:00</b><span id="cwx" class="wx"></span></div>
    <div class="stat" title="체력 · 지갑"><span class="hp"><i id="hpbar"></i></span><span class="coin"><b id="coins">0</b></span></div>
    <div class="sp"></div>
    <div class="hbtns">
      <button class="hbtn" id="bwork">업무 <span id="wcount">0/3</span></button>
      <button class="hbtn" id="bbag">가방</button>
      <button class="hbtn" id="bmap">지도</button>
      <button class="hbtn" id="brel" title="사람들">♥</button>
      <button class="hbtn" id="bmenu" title="일기 · 편지 · 상태 · 설정">≡</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="vig"></div><div id="lbT"></div><div id="lbB"></div>
    <div id="where">에렌의 방</div>
    <div class="help">이동 WASD · 확인 Space · 업무 Q · 가방 B · 지도 M · 사람들 H · 메뉴 X</div>
    <div id="black"></div>
    <div id="stand" hidden><canvas id="standL"></canvas><canvas id="standR"></canvas></div>
    <div id="dlg" hidden>
      <div id="dname">카이런</div>
      <div class="dmain"><p id="dtext"></p><div id="choices"></div></div>
      <div id="pbox"><canvas id="pcv" width="64" height="64"></canvas><div id="pname"></div></div>
      <span id="next">▼</span>
    </div>
    <div id="panel" hidden></div>
    <div id="mg" hidden></div>
    <div id="toast"></div>
    <div id="fade"></div>
    <div id="card"></div>
    <div id="title" hidden></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span class="c"></span><button data-d="u" aria-label="위">▲</button><span class="c"></span>
      <button data-d="l" aria-label="왼쪽">◀</button><span class="c"></span><button data-d="r" aria-label="오른쪽">▶</button>
      <span class="c"></span><button data-d="d" aria-label="아래">▼</button><span class="c"></span>
    </div>
    <button class="abtn" id="abtn">확인</button>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));};
function shade(h,f){const k=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return '#'+rgb(h).map(k).map(v=>v.toString(16).padStart(2,'0')).join('');}
function outline(cv,col){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height,id=g.getImageData(0,0,w,h),d=id.data,o=new Uint8ClampedArray(d),[r,gg,b]=rgb(col);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(d[i+3])continue;
    if((x>0&&d[i-1])||(x<w-1&&d[i+7])||(y>0&&d[i-w*4+3])||(y<h-1&&d[i+w*4+3])){o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255;}}
  id.data.set(o);g.putImageData(id,0,0);return cv;
}
function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};

const N4=[[1,0],[-1,0],[0,1],[0,-1]];
class Pix{
  constructor(w,h){this.w=w;this.h=h;const n=w*h;this.m=new Array(n).fill(null);this.z=new Int32Array(n);this.zc=0;this.ov=new Array(n).fill(null);}
  _s(x,y,mt){if(x<0||y<0||x>=this.w||y>=this.h)return;const i=y*this.w+x;this.m[i]=mt;this.z[i]=this.zc;}
  ell(cx,cy,rx,ry,mt){this.zc++;for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++)for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this._s(x,y,mt);}return this;}
  rect(x,y,w,h,mt){this.zc++;for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)this._s(i,j,mt);return this;}
  poly(pts,mt){this.zc++;const ys=pts.map(p=>p[1]);for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++){const py=y+.5,xs=[];
    for(let i=0;i<pts.length;i++){const [ax,ay]=pts[i],[bx,by]=pts[(i+1)%pts.length];if((ay<=py&&by>py)||(by<=py&&ay>py))xs.push(ax+(py-ay)/(by-ay)*(bx-ax));}
    xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.ceil(xs[k]-.5);x<=Math.floor(xs[k+1]-.5);x++)this._s(x,y,mt);}return this;}
  at(x,y){return (x<0||y<0||x>=this.w||y>=this.h)?null:this.m[y*this.w+x];}
  o(x,y,col){if(x>=0&&y>=0&&x<this.w&&y<this.h)this.ov[y*this.w+x]=col;}
  oM(x,y,mt,col){if(this.at(x,y)===mt)this.o(x,y,col);}
  line(x0,y0,x1,y1,col,mt){const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){mt?this.oM(x0,y0,mt,col):this.o(x0,y0,col);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
  render(R,sd,hl){
    const {w,h,m,z,ov}=this,cv=mk(w,h),g=cv.getContext('2d'),id=g.createImageData(w,h),d=id.data;
    const J=(x,y)=>(x<0||y<0||x>=w||y>=h)?-1:y*w+x;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x,mt=m[i];let col=null;
      if(mt){const r=R[mt]||ramp('#ff00ff');col=r.b;let out=false;
        for(const [dx,dy] of N4){const j=J(x+dx,y+dy);if(j<0||!m[j]||(m[j]!==mt&&z[j]<z[i])){out=true;break;}}
        if(out)col=r.o;
        else{let s=false;
          for(let k=2;k<=sd+1&&!s;k++)for(const [dx,dy] of [[k,0],[0,k],[k-1,k-1]]){const j=J(x+dx,y+dy);if(j<0||m[j]!==mt){s=true;break;}}
          if(!s)for(let k=1;k<=2;k++){const j=J(x,y-k);if(j>=0&&m[j]&&m[j]!==mt&&z[j]>z[i]){s=true;break;}}
          if(s)col=r.d;
          else if(hl){const a=J(x,y-2),b=J(x+2,y);if((a<0||m[a]!==mt)&&b>=0&&m[b]===mt)col=r.l;}
        }}
      if(ov[i])col=ov[i];
      if(col){const c=rgb(col);d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;}
    }
    g.putImageData(id,0,0);return cv;
  }
}

function drawSprite(id,dir,frame){
  const c=CH[id],s=SPR[id],P=new Pix(16,26),hy=c.small?2:0,side=dir===2,back=dir===1;
  const a=frame===1?1:0,b=frame===2?1:0,shoe=c.kind==='chef'?'boot':'shoe',arm=c.kind==='vest'?'sleeve':'top',hand=c.glove?'glove':'skin';
  // back hair
  P.ell(side?9:8,8+hy,6.6,6.4,'hair');
  if(s.bob)P.rect(side?4:1,8+hy,side?11:14,s.bob===1?6:4,'hair');
  // legs
  if(c.kind==='vest'){P.poly([[4,18],[12,18],[13,23.5],[3,23.5]],'skirt');P.rect(5,23-a,2,1,'shoe');P.rect(9,23-b,2,1,'shoe');}

  else if(frame===0){P.rect(6,20,3,4,'pants');P.rect(5,23,4,1,shoe);}
  else{P.rect(4,20,2,4,'pants');P.rect(3,23,3,1,shoe);P.rect(10,20,2,4,'pants');P.rect(10,23,3,1,shoe);}
  // body
  if(!side){
    P.rect(2,15,2,4,arm);P.rect(12,15,2,4,arm);P.rect(2,19,2,1,hand);P.rect(12,19,2,1,hand);
    P.rect(4,14,8,6,c.kind==='vest'?'top':'top');P.ell(8,15,5.2,2,c.kind==='vest'?'sleeve':'top');
    if(!back){
      if(c.kind==='tail'){P.rect(7,14,2,4,'vest');}
      if(c.kind==='vest'){P.rect(5,15,6,4,'top');}
      if(c.kind==='chef')P.rect(4,18,8,4,'apron');
    }
    if((c.kind==='coat'||c.kind==='tail')&&back)P.rect(4,19,8,3,'top');
  }else{
    P.rect(5,14,6,6,'top');if(c.kind==='chef')P.rect(4,18,3,4,'apron');
    const sw=frame===1?-1:frame===2?1:0;P.rect(7+sw,15,2,4,arm);P.rect(7+sw,19,2,1,hand);
    if(c.kind==='coat'||c.kind==='tail')P.rect(9,19,2,3,'top');
  }
  // head
  if(back){P.ell(8,8+hy,6.6,6.4,'hair');if(s.bob)P.rect(1,8+hy,14,s.bob===1?6:4,'hair');if(s.pony)P.rect(7,13+hy,2,4,'hair');if(s.curls)for(const e of s.curls)P.ell(e[0],e[1]+hy,e[2],e[3],'hair');}
  else{
    const fx=side?7:8;

    const [cx,cy,rx,ry]=s.cap;P.ell(side?cx+.5:cx,cy+hy,rx,ry,'hair');
    if(s.bangs)for(const [x,y,l] of s.bangs){if(side&&x>8)continue;P.rect(x,y+hy,1,l,'hair');}
    if(s.curls)for(const e of s.curls)if(!side||e[0]<10)P.ell(e[0],e[1]+hy,e[2],e[3],'hair');
    if(s.side&&!side)for(const r of s.side)P.rect(r[0],r[1]+hy,r[2],r[3],'hair');
    if(side&&(s.bob||s.side))P.rect(8,9+hy,3,s.bob===1?5:3,'hair');
    if(s.pony){side?P.rect(11,11+hy,2,5,'hair'):P.rect(2,12+hy,2,5,'hair');}
    const eD=shade(c.eye,-.55);
    if(side){P.o(4,10+hy,eD);P.o(4,11+hy,c.eye);P.oM(9,11+hy,'skin',c.R.skin.d);}
    else{P.o(5,10+hy,eD);P.o(5,11+hy,c.eye);P.o(10,10+hy,eD);P.o(10,11+hy,c.eye);}
    if(c.et==='fem'||c===CH.tim){side?P.o(5,12+hy,'#f2a2a0'):(P.o(4,12+hy,'#f2a2a0'),P.o(11,12+hy,'#f2a2a0'));}
    // 옷 디테일
    const R=c.R;
    if(!side){
      if(c.kind==='tail'){P.o(7,14,R.tie.b);P.o(8,14,R.tie.b);P.o(6,14,R.lapel.l);P.o(9,14,R.lapel.l);}
      if(c.kind==='coat'){for(const y of [15,17])for(let x=5;x<=10;x++)P.o(x,y,(x===7||x===8)?R.acc.l:R.acc.b);}
      if(c.kind==='uniform'){P.o(6,16,R.acc.l);P.o(9,16,R.acc.l);P.o(6,18,R.acc.l);P.o(9,18,R.acc.l);P.o(7,14,R.acc.b);P.o(8,14,R.acc.b);}
      if(c.kind==='vest'){P.o(7,14,R.shirt.b);P.o(8,14,R.shirt.b);P.o(7,15,R.tie.b);P.o(8,15,R.tie.b);P.o(7,16,R.tie.b);}
      if(c.kind==='chef'){P.o(6,15,'#1e1c22');P.o(7,16,'#1e1c22');P.o(8,17,'#1e1c22');}
      if(c.kind==='tunic'){P.o(7,14,R.shirt.b);P.o(8,14,R.shirt.b);for(let x=4;x<12;x++)P.o(x,19,R.belt.b);}
    }else{
      if(c.kind==='tail')P.o(5,14,R.tie.b);
      if(c.kind==='coat')for(const y of [15,17])for(let x=5;x<=7;x++)P.o(x,y,R.acc.b);
      if(c.kind==='uniform')P.o(5,16,R.acc.l);
    }
  }
  return P.render(c.R,1,false);
}

const ARTC={p:{},s:{}};
for(const t of ['p','s'])for(const [k,u] of Object.entries(ART[t])){const im=new Image();im.onload=()=>{const c=mk(im.width,im.height);c.getContext('2d').drawImage(im,0,0);ARTC[t][k]=c;};im.src=u;}
function bust(id,ex='n'){if(ARTC.p[id])return ARTC.p[id];const k=id+ex;return bustCache[k]||(bustCache[k]=drawFigure(id,ex,false));}
function standing(id,ex='n'){if(ARTC.s[id])return ARTC.s[id];const k=id+ex;return standCache[k]||(standCache[k]=drawFigure(id,ex,true));}
function blit(dst,src){dst.width=src.width;dst.height=src.height;const g=dst.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,dst.width,dst.height);g.drawImage(src,0,0);}
